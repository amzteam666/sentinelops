name: SentinelOps Container Security

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - app/**
      - requirements.txt
      - .github/workflows/container-security.yml

  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - app/**
      - requirements.txt
      - .github/workflows/container-security.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sentinelops-api:ci

      - name: Trivy Image Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: sentinelops-api:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Generate SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sentinelops-api:ci
          format: cyclonedx
          output: sentinelops-sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM Artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sentinelops-sbom
          path: sentinelops-sbom.cdx.json
          if-no-files-found: warn

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            shahbazalirahi/sentinelops-api:1.0.1
            shahbazalirahi/sentinelops-api:latest

