
name: SentinelOps Container Security

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/container-security.yml"

  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/container-security.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build, Scan and Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build SentinelOps image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sentinelops-api:ci

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: sentinelops-api:ci
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

      - name: Generate SBOM
        if: always() && steps.build-image.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: sentinelops-api:ci
          format: cyclonedx
          output: sentinelops-sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sentinelops-sbom
          path: sentinelops-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name != 'pull_request' && success()
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            shahbazalirahi/sentinelops-api:1.0.1
            shahbazalirahi/sentinelops-api:latest

