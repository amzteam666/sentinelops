name: Helm Security Validation

on:
  push:
    branches:
      - main
    paths:
      - "helm/**"
      - ".github/workflows/helm-security.yml"
  pull_request:
    branches:
      - main
    paths:
      - "helm/**"
      - ".github/workflows/helm-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-validation:
    name: Helm Lint and Template Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Lint Helm chart
        run: helm lint helm/sentinelops

      - name: Render Kubernetes manifests
        run: |
          helm template sentinelops helm/sentinelops \
            --namespace sentinelops-test \
            --debug > rendered-manifests.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-kubernetes-manifests
          path: rendered-manifests.yaml

  kubernetes-security-scan:
    name: Scan Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Helm templates with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: config
          scan-ref: helm/sentinelops
          severity: HIGH,CRITICAL
          exit-code: "1"
