name: SentinelOps Security Scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build Docker Image and Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build SentinelOps Docker Image
        run: |
          docker build -t sentinelops-api:${{ github.sha }} .

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: sentinelops-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
