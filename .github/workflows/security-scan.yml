name: SentinelOps Security Scan and Publish

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build, Scan and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build SentinelOps Docker Image
        run: |
          docker build \
            -t sentinelops-api:${{ github.sha }} \
            .

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: sentinelops-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag sentinelops-api:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/sentinelops-api:${{ github.sha }}

          docker tag sentinelops-api:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/sentinelops-api:latest

      - name: Push Image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sentinelops-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sentinelops-api:latest
