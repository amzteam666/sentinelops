apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinelops-auditor
  namespace: sentinelops
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinelops-pod-reader
  namespace: sentinelops
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinelops-pod-reader-binding
  namespace: sentinelops
subjects:
  - kind: ServiceAccount
    name: sentinelops-auditor
    namespace: sentinelops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sentinelops-pod-reader
