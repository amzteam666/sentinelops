apiVersion: v1
kind: Service
metadata:
  name: sentinelops-api
  labels:
    app: sentinelops-api
spec:
  type: {{ .Values.service.type }}
  selector:
    app: sentinelops-api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
